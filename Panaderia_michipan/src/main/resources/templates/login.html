
<html >
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Michipan</title>
        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <link th:href="@{/webjars/font-awesome/css/all.min.css}" rel="stylesheet"/>
        <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>

        <!-- Google fonts-->
        <link href="https://fonts.googleapis.com/css?family=Raleway:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css?family=Lora:400,400i,700,700i" rel="stylesheet" />
        <!-- Core theme CSS (includes Bootstrap)-->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha384-SmHMDPQ8F1JpDEkNDFO4RRwnzLPDqJ3bQItx/z9UW2tHIu19jeWvHNl9a2jzN/ES" crossorigin="anonymous">
        <link href="css/styles.css" rel="stylesheet" />
    </head>
    <body class="bg_index">
        <header class="header">
            <h1 class="site-heading text-center text-faded d-none d-lg-block">
                <span class="site-heading-upper text-primary mb-3">Michipan</span>
                <span class="site-heading-lower">Cafetería y Restaurante</span>
            </h1>

            <a href="https://www.instagram.com/your_instagram_username" target="_blank" rel="noopener noreferrer" style="text-align: right; display: block;">
                <img src="assets/img/michi_insta.png" alt="" style="width: 45px; height: 45px; display: inline-block;">
                <p style="font-size: 14px; color: white; display: inline-block; margin-left: 5px; margin-bottom: 0;">@Michi.Sistemas</p>
            </a>

            <a href="https://www.instagram.com/your_instagram_username" target="_blank" rel="noopener noreferrer" style="text-align: right; display: block;">
                <img src="assets/img/facebook_michi.png" alt="" style="width: 40px; height: 40px; display: inline-block;"/>
                <p style="font-size: 10px; color: white; display: inline-block; margin-left: 5px; margin-bottom: 0;">@Michi.Sistemas</p>
            </a>




            <h5 style="color: white; background-color: black; padding: 3px;">Bienvenido a nuestra cafetería y restaurante "Michi Sistemas" | WhatsApp: 7010-4897</h5>
        </header>

  <div class="row m-5 justify-content-md-center">
                <div class="col-md-4">
                    <div class="card">
                        <div class="card-header text-white" style="background-color: #996600">
                            <h2>Login</h2>
                        </div>
                        <div class="card-body" style="background-color: #cc9900"> 
                            <form method="post" th:action="@{/login}">
                                <div class="row my-3 form-group">
                                    <label class="col-md-5" for="username">
                                        <i class="fas fa-user-lock"></i>Username</label>

                                    <div class="col-md-7">
                                        <input class="form-control" type="text" name="username"/>
                                    </div>
                                </div>

                                <div class="row my-3 form-group">
                                    <label class="col-md-5" for="password">
                                        <i class="fas fa-key"></i>Password</label>

                                    <div class="col-md-7">
                                        <input class="form-control" type="password" name="password"/>
                                    </div>
                                </div>
                                <div class="card-footer col text-center">                          
                                    <button class="btn btn-danger">
                                        <a
                                            th:href="@{/registro/nuevo}"
                                            class="btn"><i class="fas fa-user-plus"></i>Registrar</a></button>
                                    <button class="btn btn-info" >
                                        <a th:href="@{/registro/recordar}" class="btn"><i class="fas fa-envelope"></i>Recuperar Usuario</a></button>
                                    <button class="btn btn-success" type="submit">
                                        <span class="btn"><i class=" fas fa-sign-in-alt"></i>
                                           login</span></button>
                                </div>                 
                        </div>


                        </form>
                    </div>
                </div>
            </div>


        <footer class="footer text-faded text-center py-5">
            <div class="container"><p class="m-0 small">Copyright &copy; Michipan2024</p></div>
        </footer>

        <!-- Bootstrap core JS-->
        <!-- Core theme JS-->
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.0.9/dist/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    </body>
</html>
